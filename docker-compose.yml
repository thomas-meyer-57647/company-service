version: '3.9'

services:
  company-service:
    build:
      context: .
    ports:
      - '8110:8110'
      - '8181:8181'
    environment:
      SERVER_PORT: 8110
      MANAGEMENT_SERVER_PORT: 8181
      SERVER_SERVLET_CONTEXT_PATH: /api/v1
      COMPANY_DB_HOST: db
      COMPANY_DB_PORT: 3306
      COMPANY_DB_NAME: company
      COMPANY_DB_USER: root
      COMPANY_DB_PASSWORD: example
      COMPANY_SWAGGER_ENABLED: 'true'
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: mariadb:10.11
    restart: unless-stopped
    ports:
      - '3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: company
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
