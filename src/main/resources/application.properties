# App
spring.application.name=company-service
server.port=${SERVER_PORT:8110}
management.server.port=${MANAGEMENT_SERVER_PORT:8181}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/api/v1}
management.endpoints.web.base-path=${MANAGEMENT_ENDPOINTS_WEB_BASE_PATH:/actuator}

# Datasource (MariaDB)
spring.datasource.url=jdbc:mariadb://${COMPANY_DB_HOST:localhost}:${COMPANY_DB_PORT:3306}/${COMPANY_DB_NAME:company}?useUnicode=true&characterEncoding=utf8&useSSL=false&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${COMPANY_DB_USER:root}
spring.datasource.password=${COMPANY_DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA: Schema kommt von Flyway, Hibernate darf nur prüfen
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_companyservice
logging.level.org.flywaydb=INFO

# Swagger / OpenAPI (springdoc)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${COMPANY_SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${COMPANY_SWAGGER_ENABLED:false}

# Cache (Caffeine)
spring.cache.type=caffeine
spring.cache.cache-names=companiesById,locationsByCompany
spring.cache.caffeine.spec=expireAfterWrite=60s,maximumSize=10000

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never

# Optional JWT Resource Server (nur wenn dependency vorhanden)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI:}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH2_JWK_SET_URI:}
security.jwt.audience=${SECURITY_JWT_AUDIENCE:company-service}
security.jwt.clock-skew-seconds=${SECURITY_JWT_CLOCK_SKEW_SECONDS:60}
